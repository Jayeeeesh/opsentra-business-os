name: Opsentra Cloud Delivery

on:
    push:
        branches:
            - feat/ibm-cloud-cd
    workflow_dispatch:

permissions:
    contents: read

jobs:
    prepare:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build Opsentra Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: false

            - name: Verify workflow
              run: echo "Opsentra delivery workflow initialized"
