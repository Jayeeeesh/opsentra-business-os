services:
  mongodb:
    image: mongo:8
    volumes:
      - opsentra-mongo-data:/data/db

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/opsentra_local
    ports:
      - "5003:5001"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5001/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opsentra-mongo-data:
    external: true
